apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-reporting-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: analytics-reporting-service
  template:
    metadata:
      labels:
        app: analytics-reporting-service
    spec:
      containers:
      - name: analytics-reporting-service
        image: analytics-reporting-service:latest
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-reporting-service
spec:
  selector:
    app: analytics-reporting-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analytics-reporting-ingress
spec:
  rules:
  - host: analytics.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: analytics-reporting-service
            port:
              number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-config
  namespace: default
---
apiVersion: v1
kind: Secret
metadata:
  name: analytics-secret
  namespace: default
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analytics-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-reporting-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: analytics-db
spec:
  serviceName: "analytics-db"
  replicas: 1
  selector:
    matchLabels:
      app: analytics-db
  template:
    metadata:
      labels:
        app: analytics-db
    spec:
      containers:
      - name: analytics-db
        image: postgres:13
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analytics-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
